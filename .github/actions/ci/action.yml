name: cl-repo CI
description: >-
  Install, test, or publish a checkout from .asd metadata
  (:depends-on + :properties :cl-repo :ci). Optional hooks in scripts/ci/.
  Requires setup-lisp (or setup-client + setup-roswell) in this job first.

inputs:
  phase:
    description: install | test | publish
    required: true
  system:
    description: ASDF system name. Empty → discover from *.asd (unique primary).
    required: false
    default: ""
  with:
    description: Extra CI systems (space-separated), merged with .asd :ci :with
    required: false
    default: ""
  registry:
    description: OCI registry URL for cl-repo:add-registry (install)
    required: false
    default: "https://ghcr.io"
  namespace:
    description: Registry namespace for project deps
    required: false
    default: "egao1980/cl-systems"
  version:
    description: OCI tag for publish (empty → .asd :version)
    required: false
    default: ""
  packager-version:
    description: cl-repository-packager OCI tag (publish)
    required: false
    default: "latest"
  oci-namespace:
    description: Publish namespace
    required: false
    default: "egao1980/cl-systems"
  sbcl-dynamic-space-mb:
    description: >-
      SBCL dynamic-space-size (MB) for the ros process. "0" or empty → SBCL
      default (1 GB on macOS, too small for fset and friends). Non-SBCL impls
      ignore it.
    required: false
    default: "4096"

runs:
  using: composite
  steps:
    - name: cl-repo ${{ inputs.phase }}
      shell: bash
      env:
        CL_REPO_CI_PHASE: ${{ inputs.phase }}
        CL_REPO_SYSTEM: ${{ inputs.system }}
        CL_REPO_CI_WITH: ${{ inputs.with }}
        CL_REPO_REGISTRY: ${{ inputs.registry }}
        CL_REPO_NAMESPACE: ${{ inputs.namespace }}
        PKG_VERSION: ${{ inputs.version }}
        PACKAGER_VERSION: ${{ inputs.packager-version }}
        OCI_NAMESPACE: ${{ inputs.oci-namespace }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
        SBCL_DYNAMIC_SPACE_MB: ${{ inputs.sbcl-dynamic-space-mb }}
      run: |
        heap=""
        if [[ -n "${SBCL_DYNAMIC_SPACE_MB}" && "${SBCL_DYNAMIC_SPACE_MB}" != 0 ]]; then
          heap="dynamic-space-size=${SBCL_DYNAMIC_SPACE_MB}"
        fi
        # shellcheck disable=SC2086
        ros ${heap} -l "${GITHUB_ACTION_PATH}/run.lisp" -q
