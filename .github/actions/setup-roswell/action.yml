name: Setup Roswell + SBCL
description: >-
  Install Roswell (Unix script / Windows zip) and optionally sbcl-bin.
  Shared by consumer test.yml and native publish-oci.yml after setup-client.

inputs:
  sbcl-version:
    description: sbcl-bin version (e.g. 2.6.7). Ignored when install-sbcl is false.
    required: false
    default: "2.6.7"
  roswell-version:
    description: Windows Roswell zip tag (Unix uses install-for-ci.sh).
    required: false
    default: "26.02.116"
  install-sbcl:
    description: If true, ros install sbcl-bin/$sbcl-version and ros use it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # macOS: do not use install-for-ci.sh (`ros use sbcl-bin` unversioned).
    # Do not trust a cached ~/.roswell sbcl-bin pin either — consumers restore
    # a dir that `ros install` calls "already installed" then `ros use` dies
    # `unable to use 'sbcl-bin/<ver>'`. Homebrew sbcl + sbcl-bin/system.
    - name: Install Roswell (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        eval "$(brew shellenv)"
        brew install roswell
        # GITHUB_PATH prepends each entry; echo brew last so it beats a
        # cached ~/.roswell/bin/ros from setup-lisp's cache restore.
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Install Roswell (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

    - name: Install Roswell (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        ROSWELL_VERSION: ${{ inputs.roswell-version }}
      run: |
        VER="${ROSWELL_VERSION:-26.02.116}"
        curl -sL "https://github.com/roswell/roswell/releases/download/v${VER}/roswell_${VER}_amd64.zip" \
          -o /tmp/roswell.zip
        rm -rf /c/roswell && mkdir -p /c/roswell
        unzip -qo /tmp/roswell.zip -d /c/roswell
        echo "/c/roswell/roswell" >> "$GITHUB_PATH"
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

    # macOS: Homebrew SBCL is the impl. `sbcl/system` is source-built and
    # is not registered; PATH sbcl is `sbcl-bin/system`.
    - name: Install SBCL (macOS)
      if: runner.os == 'macOS' && inputs.install-sbcl == 'true'
      shell: bash
      run: |
        set -euo pipefail
        eval "$(brew shellenv)"
        brew install sbcl
        command -v sbcl
        sbcl --version
        # PATH sbcl = sbcl-bin/system. sbcl/system is source-built.
        if ! ros lisp=sbcl-bin/system setup; then
          echo "ros setup failed; setting config by hand"
          ros config set default.lisp sbcl-bin
          ros config set sbcl-bin.version system
        fi
        ros use sbcl-bin/system || true
        ros -e '(format t "~&ok ~A ~A~%" (lisp-implementation-type) (lisp-implementation-version))' -q

    - name: Install SBCL
      if: runner.os != 'macOS' && inputs.install-sbcl == 'true'
      shell: bash
      env:
        SBCL_VERSION: ${{ inputs.sbcl-version }}
      run: |
        set -euo pipefail
        VER="${SBCL_VERSION:-2.6.7}"
        probe() {
          ros -e '(quit)' -q
        }
        use_pin() {
          ros install "sbcl-bin/${VER}" && ros use "sbcl-bin/${VER}" && probe
        }
        wipe_pin() {
          rm -rf "${HOME}/.roswell/impls/"*/*/sbcl-bin/"${VER}"
        }
        ok=0
        for attempt in 1 2 3 4; do
          if use_pin; then
            ok=1
            break
          fi
          echo "sbcl-bin/${VER} failed (attempt ${attempt}); wiping impl dir and retrying..."
          wipe_pin
          sleep $((2 ** attempt))
        done
        if [[ "$ok" -ne 1 ]]; then
          echo "ros install sbcl-bin/${VER} failed after retries" >&2
          exit 1
        fi
