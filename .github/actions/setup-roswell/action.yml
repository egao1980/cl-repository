name: Setup Roswell + SBCL
description: >-
  Install Roswell (pinned release tarball / Windows zip) and optionally sbcl-bin.
  Shared by consumer test.yml and native publish-oci.yml after setup-client.
  Release assets are fetched with retries into a cached download directory, and
  ~/.roswell is cached, so a warm job downloads nothing from GitHub releases
  (2026-11-08: release downloads returned 504 for over an hour and took out every
  uncached job).

inputs:
  sbcl-version:
    description: sbcl-bin version (e.g. 2.6.7). Ignored when install-sbcl is false.
    required: false
    default: "2.6.7"
  roswell-version:
    description: Roswell release (Linux tarball and Windows zip).
    required: false
    default: "26.02.116"
  install-sbcl:
    description: If true, ros install sbcl-bin/$sbcl-version and ros use it.
    required: false
    default: "true"
  cache:
    description: >-
      Cache ~/.roswell here. setup-lisp passes false: it caches ~/.roswell
      itself. The download cache is always on.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Prepare download cache
      shell: bash
      run: mkdir -p "${HOME}/.cache/cl-repo-ci/downloads"

    - name: Cache release downloads
      uses: actions/cache@v5
      with:
        path: ~/.cache/cl-repo-ci/downloads
        key: ${{ runner.os }}-${{ runner.arch }}-cl-repo-ci-downloads-roswell-${{ inputs.roswell-version }}

    - name: Cache Roswell home
      if: inputs.cache == 'true' && runner.os != 'macOS'
      uses: actions/cache@v5
      with:
        path: |
          ~/.roswell
          C:\roswell
        key: ${{ runner.os }}-${{ runner.arch }}-setup-roswell-${{ inputs.roswell-version }}-sbcl-${{ inputs.install-sbcl }}-${{ inputs.sbcl-version }}

    # macOS: Homebrew ros + PATH sbcl. Never ros install sbcl-bin here —
    # cached ~/.roswell marks a pin "already installed" then ros use dies.
    - name: Install Roswell (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        eval "$(brew shellenv)"
        brew install roswell sbcl
        # GITHUB_PATH prepends; echo brew last so it beats cached ~/.roswell/bin.
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Install Roswell (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        ROSWELL_VERSION: ${{ inputs.roswell-version }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/fetch.sh"
        if ! command -v ros >/dev/null 2>&1; then
          arch="$(uname -m | sed s/aarch64/arm64/)"
          file="roswell-${ROSWELL_VERSION}-linux-${arch}.tar.bz2"
          tarball="$(fetch "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/${file}" "${file}")"
          rm -rf /tmp/roswell && mkdir -p /tmp/roswell
          tar -C /tmp/roswell --strip-components=1 -xjf "${tarball}"
          SUDO=""; [[ "$(id -u)" -ne 0 ]] && SUDO=sudo
          ${SUDO} make -C /tmp/roswell install >/dev/null
        fi
        ros version | head -1
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

    - name: Install Roswell (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        ROSWELL_VERSION: ${{ inputs.roswell-version }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/fetch.sh"
        if [[ ! -x /c/roswell/roswell/ros.exe ]]; then
          file="roswell_${ROSWELL_VERSION}_amd64.zip"
          zip="$(fetch "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/${file}" "${file}")"
          rm -rf /c/roswell && mkdir -p /c/roswell
          unzip -qo "${zip}" -d /c/roswell
        fi
        echo "/c/roswell/roswell" >> "$GITHUB_PATH"
        echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

    # PATH Homebrew sbcl is sbcl-bin/system. sbcl/system is a source build
    # and is not registered (roswell#416). Cached ~/.roswell makes
    # `ros use` report "unable to use" even after `ros setup`.
    - name: Use system SBCL (macOS)
      if: runner.os == 'macOS' && inputs.install-sbcl == 'true'
      shell: bash
      run: |
        set -euo pipefail
        eval "$(brew shellenv)"
        command -v sbcl
        sbcl --version
        rm -rf "${HOME}/.roswell/impls"
        mkdir -p "${HOME}/.roswell"
        ros lisp=sbcl-bin/system setup || true
        ros config set default.lisp sbcl-bin
        ros config set sbcl-bin.version system
        ros use sbcl-bin/system || true
        ros -e '(format t "~&ok ~A ~A~%" (lisp-implementation-type) (lisp-implementation-version))' -q

    - name: Install SBCL
      if: runner.os != 'macOS' && inputs.install-sbcl == 'true'
      shell: bash
      env:
        SBCL_VERSION: ${{ inputs.sbcl-version }}
      run: |
        set -euo pipefail
        VER="${SBCL_VERSION:-2.6.7}"
        probe() {
          ros -e '(quit)' -q
        }
        # A cached ~/.roswell already holds the pin: use it without asking
        # GitHub releases for sbcl-bin_uri.tsv again.
        if compgen -G "${HOME}/.roswell/impls/*/*/sbcl-bin/${VER}" >/dev/null \
           && ros use "sbcl-bin/${VER}" && probe; then
          echo "sbcl-bin/${VER} from cache"
          exit 0
        fi
        use_pin() {
          ros install "sbcl-bin/${VER}" && ros use "sbcl-bin/${VER}" && probe
        }
        wipe_pin() {
          rm -rf "${HOME}/.roswell/impls/"*/*/sbcl-bin/"${VER}"
        }
        ok=0
        for attempt in 1 2 3 4 5 6; do
          if use_pin; then
            ok=1
            break
          fi
          echo "sbcl-bin/${VER} failed (attempt ${attempt}); wiping impl dir and retrying..."
          wipe_pin
          sleep $((5 * 2 ** attempt))
        done
        if [[ "$ok" -ne 1 ]]; then
          echo "ros install sbcl-bin/${VER} failed after retries" >&2
          exit 1
        fi
