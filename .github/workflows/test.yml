name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  SBCL_VERSION: 2.6.7
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  docs-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check docs translation sync
        run: |
          bash scripts/check-doc-translations.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system:
          - cl-oci
          - cl-oci-client
          - cl-repository-packager
          - cl-repository-client
          - cl-repository-ql-exporter

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Test ${{ matrix.system }}
        run: |
          # An error (a test file that does not read, a failing suite: the
          # test-op signals) must exit nonzero, not drop into the debugger,
          # whose REPL reads EOF and exits 0.
          qlot exec ros -e '(setf *debugger-hook* (lambda (c h) (declare (ignore h)) (format *error-output* "~&UNHANDLED: ~A~%" c) (uiop:quit 1)))' \
            -e '(asdf:test-system "${{ matrix.system }}")' -q

  integration:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5050:5000

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Run integration tests
        run: |
          # An error (a test file that does not read, a failing suite: the
          # test-op signals) must exit nonzero, not drop into the debugger,
          # whose REPL reads EOF and exits 0.
          qlot exec ros -e '(setf *debugger-hook* (lambda (c h) (declare (ignore h)) (format *error-output* "~&UNHANDLED: ~A~%" c) (uiop:quit 1)))' \
            -e '(asdf:test-system "cl-repository-integration-tests")' -q

  ocicl-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Install OCICL
        run: |
          set -euo pipefail
          source .github/actions/setup-roswell/fetch.sh
          OCICL_VERSION=$(curl -fsSI --retry 5 --retry-all-errors https://github.com/ocicl/ocicl/releases/latest \
                          | grep -i ^location: | sed 's|.*/v||;s/\r//')
          deb="$(fetch "https://github.com/ocicl/ocicl/releases/download/v${OCICL_VERSION}/ocicl_${OCICL_VERSION}-1_amd64.deb" \
                       "ocicl_${OCICL_VERSION}-1_amd64.deb")"
          sudo dpkg -i "${deb}"
          ocicl version

      - name: Run OCICL compatibility test
        run: bash tests/integration/test-ocicl-compat.sh

  setup-client-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-roswell

      - name: Setup cl-repository-client from OCI
        id: cl-repo
        uses: ./.github/actions/setup-client

      - name: Load client from OCI dest
        shell: bash
        run: |
          : "${CL_REPOSITORY_CLIENT_VERSION:?}"
          : "${CL_REPOSITORY_DEST:?}"
          if [[ -n "${CL_SOURCE_REGISTRY:-}" ]]; then
            echo "CL_SOURCE_REGISTRY must be unset" >&2
            exit 1
          fi
          echo "Resolved client ${CL_REPOSITORY_CLIENT_VERSION}"
          ros -e '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:ensure-directory-pathname (uiop:getenv "CL_REPOSITORY_DEST"))) :ignore-inherited-configuration))' -e '(asdf:load-system "cl-repository-client")' -e '(format t "~&loaded cl-repository-client from ~a~%" (asdf:system-source-directory "cl-repository-client"))' -q

  checkout-client-async:
    # This branch's client (not the published one) on every OS with the
    # default HTTP backend: async over libuv + cl-stack-ssl, against GHCR.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-roswell

      - name: Client dependencies from OCI
        uses: ./.github/actions/setup-client

      - name: A cold start keeps stdout for the command (#194, #193)
        shell: bash
        run: |
          # The first run after an upgrade compiles the client and its
          # dependencies. stdout is the command's line alone, quiet or not.
          # Quiet (the default), stderr holds no compiler output. With
          # CL_REPO_VERBOSE=1 it holds the whole compile, and no structure of
          # this checkout has a slot accessor that overwrites its predicate.
          unset CL_REPOSITORY_CLIENT_DIR CL_REPO_HTTP_BACKEND CL_REPO_VERBOSE
          cold() {
            local mode=$1 out err lines
            shift
            out="$RUNNER_TEMP/cold-$mode.out"
            err="$RUNNER_TEMP/cold-$mode.err"
            env XDG_CACHE_HOME="$RUNNER_TEMP/cold-fasl-$mode" "$@" \
              sh "$GITHUB_WORKSPACE/roswell/cl-repo" --version > "$out" 2> "$err" \
              || { tail -40 "$err"; echo "::error::cl-repo --version failed ($mode)"; return 1; }
            lines="$(wc -l < "$out" | tr -d ' ')"
            echo "; $mode: stdout $(tr -d '\r' < "$out"), stderr $(wc -l < "$err" | tr -d ' ') lines"
            if [[ "$lines" != 1 ]] || ! grep -q '^cl-repo ' "$out"; then
              head -20 "$out"
              echo "::error::stdout is not the version line alone ($mode, $lines lines)"
              return 1
            fi
          }
          cold quiet
          if grep -m 3 '^; compiling' "$RUNNER_TEMP/cold-quiet.err"; then
            echo "::error::a quiet cold start printed compiler output"
            exit 1
          fi
          cold verbose CL_REPO_VERBOSE=1
          grep -q '^; compiling' "$RUNNER_TEMP/cold-verbose.err" \
            || { echo "::error::CL_REPO_VERBOSE=1 printed no compiler output"; exit 1; }
          # The file being compiled when SBCL warns that a slot accessor
          # overwrites the structure's predicate; dependencies are under .cl-repository/.
          clash="$(tr -d '\r' < "$RUNNER_TEMP/cold-verbose.err" \
                   | awk 'index($0, "; compiling file ") == 1 { f = $0 }
                          /type predicate/ && f !~ /[\\\/]\.cl-repository[\\\/]/ { print f }' | sort -u)"
          if [[ -n "$clash" ]]; then
            echo "$clash"
            echo "::error::a structure predicate is also a slot accessor (#193)"
            exit 1
          fi

      - name: Sync a project with the checkout's client
        shell: bash
        run: |
          # setup-client points this at the published client; use the checkout's.
          # CL_REPO_VERBOSE: the checks below read the whole load transcript.
          unset CL_REPOSITORY_CLIENT_DIR CL_REPO_HTTP_BACKEND
          export CL_REPO_VERBOSE=1
          work="$RUNNER_TEMP/async-probe"
          mkdir -p "$work" && cd "$work"
          printf '(defsystem "async-probe" :depends-on ("alexandria" "cl-ppcre" "split-sequence"))\n' > async-probe.asd
          ros +Q -- "$GITHUB_WORKSPACE/roswell/cl-repo.ros" sync 2>&1 | tee sync.log
          if grep -E "async HTTP backend unavailable|Memory fault|loaded before cl-stack-ssl" sync.log; then
            echo "::error::the async backend did not run cleanly" >&2
            exit 1
          fi

      - name: Launcher survives an inherited exception port (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # An editor with a crash reporter (Zed) hands its Mach exception port
          # to the processes it starts; SBCL then blocks on its first trap.
          # roswell/cl-repo clears the port before Roswell starts.
          unset CL_REPOSITORY_CLIENT_DIR CL_REPO_HTTP_BACKEND
          spawn="python3 -I $GITHUB_WORKSPACE/scripts/spawn-with-exception-port.py"
          # control: a plain SBCL trap under the port must hang, or this step proves nothing
          if $spawn 30 ros +Q -e '(print (handler-case (funcall (compile nil (quote (lambda (x) (car x)))) 1) (error () :trapped)))'; then
            echo "::error::the harness did not reproduce the inherited-port hang" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/async-probe"
          $spawn 600 sh "$GITHUB_WORKSPACE/roswell/cl-repo" sync

      - name: Launcher sets the client and test image heap (#175)
        shell: bash
        run: |
          # roswell/cl-repo starts SBCL with CL_REPO_DYNAMIC_SPACE_MB (default
          # 4096, as test-system.yml); cl-repo test's image gets the same size.
          unset CL_REPOSITORY_CLIENT_DIR CL_REPO_HTTP_BACKEND CL_REPO_DYNAMIC_SPACE_MB
          work="$RUNNER_TEMP/heap-probe"
          mkdir -p "$work"
          cd "$work" || exit 1
          cat > heap-probe.asd <<'ASD'
          (defsystem "heap-probe"
            :perform (test-op (o c)
                       (declare (ignore o c))
                       (format t "~&HEAP-MB ~D~%" (floor (sb-ext:dynamic-space-size) (* 1024 1024)))))
          ASD
          check() {
            local want=$1 log=test.log got
            shift
            env "$@" sh "$GITHUB_WORKSPACE/roswell/cl-repo" test > "$log" 2>&1 \
              || { tail -40 "$log"; echo "::error::cl-repo test failed (${*:-default})"; return 1; }
            got="$(tr -d '\r' < "$log" | sed -n 's/^HEAP-MB //p')"
            echo "; ${*:-default}: ${got:-none} MB"
            [[ "$got" == "$want" ]] || { echo "::error::heap ${got:-none} MB, expected ${want} MB (${*:-default})"; return 1; }
          }
          check 4096
          check 4096 CL_REPO_TEST_IN_PROCESS=1
          check 2048 CL_REPO_DYNAMIC_SPACE_MB=2048

  setup-lisp-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Lisp (VM path — cache Roswell + client tree)
        uses: ./.github/actions/setup-lisp

      - name: Load client from OCI dest
        shell: bash
        run: |
          : "${CL_REPOSITORY_CLIENT_VERSION:?}"
          : "${CL_REPOSITORY_DEST:?}"
          if [[ -n "${CL_SOURCE_REGISTRY:-}" ]]; then
            echo "CL_SOURCE_REGISTRY must be unset" >&2
            exit 1
          fi
          echo "Resolved client ${CL_REPOSITORY_CLIENT_VERSION}"
          ros -e '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:ensure-directory-pathname (uiop:getenv "CL_REPOSITORY_DEST"))) :ignore-inherited-configuration))' -e '(asdf:load-system "cl-repository-client")' -e '(format t "~&loaded cl-repository-client from ~a~%" (asdf:system-source-directory "cl-repository-client"))' -q

      # ci action phase run (cl-repository#103): a subdirectory project, the
      # README `cl-repo run -- sbcl …` form, and a failing command.
      - name: Make a subdirectory project
        shell: bash
        run: |
          mkdir -p ci-run-demo
          printf '%s\n' '(defsystem "ci-run-demo" :version "0.0.1" :depends-on ("alexandria"))' \
            > ci-run-demo/ci-run-demo.asd

      # dep-cache (cl-repository#136): restore before the ci phases.
      - name: Restore dependency cache
        id: dep-cache
        uses: ./.github/actions/dep-cache

      - name: dep-cache key and fasl dir
        shell: bash
        env:
          KEY: ${{ steps.dep-cache.outputs.key }}
          FASL: ${{ steps.dep-cache.outputs.fasl }}
        run: |
          echo "key=${KEY} fasl=${FASL} XDG_CACHE_HOME=${XDG_CACHE_HOME:-}"
          [[ "${KEY}" =~ ^${RUNNER_OS}-${RUNNER_ARCH}-cl-deps-v1-sbcl-client-${CL_REPOSITORY_CLIENT_VERSION}-image-[0-9A-Za-z-]+-[0-9]{8}-[0-9a-f]{16}$ ]] \
            || { echo "unexpected dep-cache key"; exit 1; }
          [[ -n "${XDG_CACHE_HOME:-}" && "${FASL}" == "${XDG_CACHE_HOME}/common-lisp" ]] \
            || { echo "XDG_CACHE_HOME not exported"; exit 1; }

      - name: ci phase run
        id: install
        uses: ./.github/actions/ci
        with:
          phase: run
          working-directory: ci-run-demo
          command: >-
            sbcl --non-interactive --no-userinit --eval '(require "asdf")'
            --eval '(asdf:load-system "ci-run-demo")'
            --eval '(format t "~&ci-run-demo: alexandria ~a~%" (asdf:component-version (asdf:find-system "alexandria")))'

      - name: ci phase run (failing command)
        id: run-fails
        continue-on-error: true
        uses: ./.github/actions/ci
        with:
          phase: run
          working-directory: ci-run-demo
          command: sbcl --non-interactive --no-userinit --eval '(uiop:quit 3)'

      - name: The failing command failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.run-fails.outcome }}
        run: '[[ "${OUTCOME}" == failure ]] || { echo "phase run ignored exit 3 (outcome ${OUTCOME})"; exit 1; }'

      - name: Save dependency cache
        if: always() && steps.install.outcome == 'success'
        uses: ./.github/actions/dep-cache
        with:
          mode: save
          key: ${{ steps.dep-cache.outputs.key }}
          fasl: ${{ steps.dep-cache.outputs.fasl }}
          cache-hit: ${{ steps.dep-cache.outputs.cache-hit }}

  # ci action on ABCL (cl-repository#122): the test-system-impl.yml lane with
  # this checkout's ci action, so a PR proves the client loads on ABCL
  # (cffi-abcl + JSS + JNA from CLASSPATH) before consumers pick it up.
  ci-action-abcl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-lisp
        with:
          install-sbcl: "false"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Roswell impl
        uses: actions/cache@v5
        with:
          path: ~/.roswell/impls/*/*/abcl-bin
          key: ${{ runner.os }}-${{ runner.arch }}-ros-impl-abcl-bin-default-v1

      - name: Install abcl-bin
        run: |
          set -euo pipefail
          if ! ros use abcl-bin 2>/dev/null; then
            for attempt in 1 2 3 4; do
              if ros install abcl-bin && ros use abcl-bin; then break; fi
              sleep $((5 * 2 ** attempt))
            done
          fi
          ros -e '(format t "~&lisp ~A ~A~%" (lisp-implementation-type) (lisp-implementation-version))' -q

      - name: Install JNA (CFFI on ABCL)
        run: |
          JNA_VER=5.14.0
          mkdir -p "$HOME/jna"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o "$HOME/jna/jna-${JNA_VER}.jar" \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/${JNA_VER}/jna-${JNA_VER}.jar"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o "$HOME/jna/jna-platform-${JNA_VER}.jar" \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna-platform/${JNA_VER}/jna-platform-${JNA_VER}.jar"
          {
            echo "CLASSPATH=$HOME/jna/jna-${JNA_VER}.jar:$HOME/jna/jna-platform-${JNA_VER}.jar${CLASSPATH:+:$CLASSPATH}"
            echo "JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED ${JAVA_TOOL_OPTIONS:-}"
          } >> "$GITHUB_ENV"

      - name: Make a demo project
        run: |
          mkdir -p ci-abcl-demo
          printf '%s\n' '(defsystem "ci-abcl-demo" :version "0.0.1" :depends-on ("alexandria"))' \
            > ci-abcl-demo/ci-abcl-demo.asd

      - name: ci phase install
        uses: ./.github/actions/ci
        with:
          phase: install
          working-directory: ci-abcl-demo

      - name: ci phase test
        uses: ./.github/actions/ci
        with:
          phase: test
          working-directory: ci-abcl-demo
