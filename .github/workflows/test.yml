name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  SBCL_VERSION: 2.6.7
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  docs-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check docs translation sync
        run: |
          bash scripts/check-doc-translations.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system:
          - cl-oci
          - cl-oci-client
          - cl-repository-packager
          - cl-repository-client
          - cl-repository-ql-exporter

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Test ${{ matrix.system }}
        run: |
          # An error (a test file that does not read, a failing suite: the
          # test-op signals) must exit nonzero, not drop into the debugger,
          # whose REPL reads EOF and exits 0.
          qlot exec ros -e '(setf *debugger-hook* (lambda (c h) (declare (ignore h)) (format *error-output* "~&UNHANDLED: ~A~%" c) (uiop:quit 1)))' \
            -e '(asdf:test-system "${{ matrix.system }}")' -q

  integration:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5050:5000

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Run integration tests
        run: |
          # An error (a test file that does not read, a failing suite: the
          # test-op signals) must exit nonzero, not drop into the debugger,
          # whose REPL reads EOF and exits 0.
          qlot exec ros -e '(setf *debugger-hook* (lambda (c h) (declare (ignore h)) (format *error-output* "~&UNHANDLED: ~A~%" c) (uiop:quit 1)))' \
            -e '(asdf:test-system "cl-repository-integration-tests")' -q

  ocicl-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Install OCICL
        run: |
          set -euo pipefail
          source .github/actions/setup-roswell/fetch.sh
          OCICL_VERSION=$(curl -fsSI --retry 5 --retry-all-errors https://github.com/ocicl/ocicl/releases/latest \
                          | grep -i ^location: | sed 's|.*/v||;s/\r//')
          deb="$(fetch "https://github.com/ocicl/ocicl/releases/download/v${OCICL_VERSION}/ocicl_${OCICL_VERSION}-1_amd64.deb" \
                       "ocicl_${OCICL_VERSION}-1_amd64.deb")"
          sudo dpkg -i "${deb}"
          ocicl version

      - name: Run OCICL compatibility test
        run: bash tests/integration/test-ocicl-compat.sh

  setup-client-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-roswell

      - name: Setup cl-repository-client from OCI
        id: cl-repo
        uses: ./.github/actions/setup-client

      - name: Load client from OCI dest
        shell: bash
        run: |
          : "${CL_REPOSITORY_CLIENT_VERSION:?}"
          : "${CL_REPOSITORY_DEST:?}"
          if [[ -n "${CL_SOURCE_REGISTRY:-}" ]]; then
            echo "CL_SOURCE_REGISTRY must be unset" >&2
            exit 1
          fi
          echo "Resolved client ${CL_REPOSITORY_CLIENT_VERSION}"
          ros -e '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:ensure-directory-pathname (uiop:getenv "CL_REPOSITORY_DEST"))) :ignore-inherited-configuration))' -e '(asdf:load-system "cl-repository-client")' -e '(format t "~&loaded cl-repository-client from ~a~%" (asdf:system-source-directory "cl-repository-client"))' -q

  checkout-client-async:
    # This branch's client (not the published one) on every OS with the
    # default HTTP backend: async over libuv + cl-stack-ssl, against GHCR.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-roswell

      - name: Client dependencies from OCI
        uses: ./.github/actions/setup-client

      - name: Sync a project with the checkout's client
        shell: bash
        run: |
          # setup-client points this at the published client; use the checkout's
          unset CL_REPOSITORY_CLIENT_DIR CL_REPO_HTTP_BACKEND
          work="$RUNNER_TEMP/async-probe"
          mkdir -p "$work" && cd "$work"
          printf '(defsystem "async-probe" :depends-on ("alexandria" "cl-ppcre" "split-sequence"))\n' > async-probe.asd
          ros +Q -- "$GITHUB_WORKSPACE/roswell/cl-repo.ros" sync 2>&1 | tee sync.log
          if grep -E "async HTTP backend unavailable|Memory fault|loaded before cl-stack-ssl" sync.log; then
            echo "::error::the async backend did not run cleanly" >&2
            exit 1
          fi

  setup-lisp-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Lisp (VM path — cache Roswell + client tree)
        uses: ./.github/actions/setup-lisp

      - name: Load client from OCI dest
        shell: bash
        run: |
          : "${CL_REPOSITORY_CLIENT_VERSION:?}"
          : "${CL_REPOSITORY_DEST:?}"
          if [[ -n "${CL_SOURCE_REGISTRY:-}" ]]; then
            echo "CL_SOURCE_REGISTRY must be unset" >&2
            exit 1
          fi
          echo "Resolved client ${CL_REPOSITORY_CLIENT_VERSION}"
          ros -e '(asdf:initialize-source-registry (list :source-registry (list :tree (uiop:ensure-directory-pathname (uiop:getenv "CL_REPOSITORY_DEST"))) :ignore-inherited-configuration))' -e '(asdf:load-system "cl-repository-client")' -e '(format t "~&loaded cl-repository-client from ~a~%" (asdf:system-source-directory "cl-repository-client"))' -q
