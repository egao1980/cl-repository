name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  SBCL_VERSION: 2.6.7

jobs:
  docs-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check docs translation sync
        run: |
          bash scripts/check-doc-translations.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system:
          - cl-oci
          - cl-oci-client
          - cl-repository-packager
          - cl-repository-client
          - cl-repository-ql-exporter

    steps:
      - uses: actions/checkout@v5

      - name: Install Roswell
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies
        run: |
          ros install qlot
          qlot install

      - name: Test ${{ matrix.system }}
        run: |
          qlot exec ros -e '(asdf:test-system "${{ matrix.system }}")'

  integration:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5050:5000

    steps:
      - uses: actions/checkout@v5

      - name: Install Roswell
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies
        run: |
          ros install qlot
          qlot install

      - name: Run integration tests
        run: |
          qlot exec ros -e '(asdf:test-system "cl-repository-integration-tests")'

  ocicl-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Roswell
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies
        run: |
          ros install qlot
          qlot install

      - name: Install OCICL
        run: |
          OCICL_VERSION=$(curl -sI https://github.com/ocicl/ocicl/releases/latest | grep -i ^location: | sed 's|.*/v||;s/\r//')
          curl -sL "https://github.com/ocicl/ocicl/releases/download/v${OCICL_VERSION}/ocicl_${OCICL_VERSION}-1_amd64.deb" -o /tmp/ocicl.deb
          sudo dpkg -i /tmp/ocicl.deb
          ocicl version

      - name: Run OCICL compatibility test
        run: bash tests/integration/test-ocicl-compat.sh

  setup-client-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-roswell

      - name: Setup cl-repository-client from OCI
        id: cl-repo
        uses: ./.github/actions/setup-client

      - name: Load client via CL_SOURCE_REGISTRY
        shell: bash
        run: |
          : "${CL_REPOSITORY_CLIENT_VERSION:?}"
          : "${CL_SOURCE_REGISTRY:?}"
          : "${CL_REPOSITORY_DEST:?}"
          echo "Resolved client ${CL_REPOSITORY_CLIENT_VERSION}"
          echo "registry ${CL_SOURCE_REGISTRY}"
          # Prove the extract tree is enough (checkout also has the asd).
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) export CL_SOURCE_REGISTRY="${CL_REPOSITORY_DEST}//;" ;;
            *) export CL_SOURCE_REGISTRY="${CL_REPOSITORY_DEST}//:" ;;
          esac
          ros -e '(asdf:load-system "cl-repository-client")' -e '(format t "~&loaded cl-repository-client from ~a~%" (asdf:system-source-directory "cl-repository-client"))' -q
