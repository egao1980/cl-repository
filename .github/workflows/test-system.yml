# Reusable consumer test: checkout + setup-lisp + ci install/test.
# Ubuntu jobs run in ci-base (ros/SBCL/client already installed).
# macOS/Windows stay on the VM (job containers are Linux-only).
#
#   jobs:
#     test:
#       uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
#
# Optional inputs: system, os-json, extra-with, sbcl-version, client-version, ci-image,
# sbcl-dynamic-space-mb (default 4096; macOS SBCL defaults to 1 GB).
# Optional secret: registry-token (a read:packages token for private GHCR
# dependencies the job's GITHUB_TOKEN cannot read; README "Private packages").
# Caller does not copy ci-install.lisp / ci-test.lisp.
name: Test CL system

on:
  workflow_call:
    inputs:
      system:
        description: ASDF system (empty → discover from *.asd)
        required: false
        type: string
        default: ""
      os-json:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
      extra-with:
        description: Space-separated CI extras (merged with .asd :ci :with)
        required: false
        type: string
        default: ""
      sbcl-version:
        required: false
        type: string
        default: "2.6.7"
      roswell-version:
        required: false
        type: string
        default: "26.02.116"
      client-version:
        description: setup-client OCI tag (default latest anchor)
        required: false
        type: string
        default: "latest"
      ci-image:
        description: >-
          Ubuntu job container with ros/SBCL/client. Empty disables the
          container (install on the VM). Ignored on macOS/Windows.
        required: false
        type: string
        default: "ghcr.io/egao1980/cl-repository/ci-base:latest"
      sbcl-dynamic-space-mb:
        description: SBCL dynamic-space-size (MB) for install + test. 0 → SBCL default.
        required: false
        type: number
        default: 4096
      dep-cache:
        description: >-
          Cache installed systems + fasls between runs (one cache per UTC day
          and .asd hash; cl-repository#136). "false" installs cold every run.
        required: false
        type: string
        default: "true"
    secrets:
      registry-token:
        description: >-
          Token cl-repo pulls ghcr.io packages with (CL_REPO_REGISTRY_TOKEN),
          before the job's GITHUB_TOKEN. Only for private dependencies that do
          not grant this repository Actions access.
        required: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-json) }}
    runs-on: ${{ matrix.os }}
    # Image string or null. Do not mention `secrets` here — reusable-workflow
    # parse rejects it. Do not mention `matrix` in jobs.<id>.if either.
    # The runner pulls this image without credentials, so ci-base stays public.
    # Dependencies are another matter: cl-repo pulls them with the job's
    # GITHUB_TOKEN (packages: read; the ci action passes GITHUB_ACTOR too), so
    # a private package works once it grants the calling repository Actions
    # access, or with the registry-token secret (cl-repository#186).
    container: ${{ (startsWith(matrix.os, 'ubuntu') && inputs.ci-image != '') && inputs.ci-image || fromJSON('null') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      SBCL_VERSION: ${{ inputs.sbcl-version }}
      ROSWELL_VERSION: ${{ inputs.roswell-version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # empty when the caller passes no registry-token: cl-repo ignores it
      CL_REPO_REGISTRY_TOKEN: ${{ secrets.registry-token }}
    steps:
      # Windows git defaults to core.autocrlf=true: a checked-out .lisp gets
      # CRLF, and a FORMAT tilde-newline becomes tilde-Return, which SBCL
      # rejects at compile time (cl-repository#178). Set before checkout, on
      # every OS, so the tree matches the committed blobs. Without git (a
      # custom image) checkout falls back to a GitHub archive, already LF.
      - name: Check out with LF line endings
        shell: bash
        run: |
          command -v git >/dev/null 2>&1 || exit 0
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      # uses: cannot interpolate inputs/github — GH parse-time restriction.
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: ${{ inputs.client-version }}
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/dep-cache@main
        id: dep-cache
        with:
          impl: sbcl
          enabled: ${{ inputs.dep-cache }}

      - id: install
        uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: ${{ inputs.system }}
          sbcl-dynamic-space-mb: ${{ inputs.sbcl-dynamic-space-mb }}
          with: ${{ inputs.extra-with }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: ${{ inputs.system }}
          sbcl-dynamic-space-mb: ${{ inputs.sbcl-dynamic-space-mb }}

      - uses: egao1980/cl-repository/.github/actions/dep-cache@main
        if: always() && steps.install.outcome == 'success'
        with:
          mode: save
          impl: sbcl
          enabled: ${{ inputs.dep-cache }}
          key: ${{ steps.dep-cache.outputs.key }}
          fasl: ${{ steps.dep-cache.outputs.fasl }}
          cache-hit: ${{ steps.dep-cache.outputs.cache-hit }}
