# Reusable consumer test: checkout + setup-lisp + ci install/test.
# Ubuntu jobs run in ci-base (ros/SBCL/client already installed).
# macOS/Windows stay on the VM (job containers are Linux-only).
#
#   jobs:
#     test:
#       uses: egao1980/cl-repository/.github/workflows/test-system.yml@main
#
# Optional inputs: system, os-json, extra-with, sbcl-version, client-version, ci-image.
# Caller does not copy ci-install.lisp / ci-test.lisp.
name: Test CL system

on:
  workflow_call:
    inputs:
      system:
        description: ASDF system (empty → discover from *.asd)
        required: false
        type: string
        default: ""
      os-json:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'
      extra-with:
        description: Space-separated CI extras (merged with .asd :ci :with)
        required: false
        type: string
        default: ""
      sbcl-version:
        required: false
        type: string
        default: "2.6.7"
      roswell-version:
        required: false
        type: string
        default: "26.02.116"
      client-version:
        description: setup-client OCI tag (default latest anchor)
        required: false
        type: string
        default: "latest"
      ci-image:
        description: >-
          Ubuntu job container with ros/SBCL/client. Empty disables the
          container (install on the VM). Ignored on macOS/Windows.
        required: false
        type: string
        default: "ghcr.io/egao1980/cl-repository/ci-base:latest"

jobs:
  # credentials must be a mapping (docs), not inside a format() expression —
  # reusable-workflow parse rejects `secrets` there (Unrecognized named-value).
  test-ubuntu:
    if: ${{ inputs.ci-image != '' && startsWith(matrix.os, 'ubuntu') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-json) }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ inputs.ci-image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      SBCL_VERSION: ${{ inputs.sbcl-version }}
      ROSWELL_VERSION: ${{ inputs.roswell-version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: ${{ inputs.client-version }}
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: ${{ inputs.system }}
          with: ${{ inputs.extra-with }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: ${{ inputs.system }}

  test:
    if: ${{ inputs.ci-image == '' || !startsWith(matrix.os, 'ubuntu') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-json) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      SBCL_VERSION: ${{ inputs.sbcl-version }}
      ROSWELL_VERSION: ${{ inputs.roswell-version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: ${{ inputs.client-version }}
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: ${{ inputs.system }}
          with: ${{ inputs.extra-with }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: ${{ inputs.system }}
