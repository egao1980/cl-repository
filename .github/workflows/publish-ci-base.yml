# Build / publish the Ubuntu job-container image used by test-system.yml
# and publish-source.yml. Not a Docker container action.
name: Publish CI base image

on:
  push:
    branches: [main]
    paths:
      - docker/ci-base/**
      - .github/actions/setup-client/setup-client.sh
      - .github/workflows/publish-ci-base.yml
  pull_request:
    paths:
      - docker/ci-base/**
      - .github/actions/setup-client/setup-client.sh
      - .github/workflows/publish-ci-base.yml
  schedule:
    # Pick up cl-repository-client :latest
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/egao1980/cl-repository/ci-base
  SBCL_VERSION: "2.6.7"
  ROSWELL_VERSION: "26.02.116"
  ORAS_VERSION: "1.2.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci-base/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:local
          build-args: |
            SBCL_VERSION=${{ env.SBCL_VERSION }}
            ROSWELL_VERSION=${{ env.ROSWELL_VERSION }}
            CLIENT_VERSION=latest
            ORAS_VERSION=${{ env.ORAS_VERSION }}

      - name: Smoke
        run: |
          docker run --rm "${IMAGE}:local" bash -lc '
            set -euo pipefail
            test -f /opt/cl-ci/ok
            . /opt/cl-ci/image.env
            command -v ros
            command -v oras
            ros -e "(format t \"~A ~A~%\" (lisp-implementation-type) (lisp-implementation-version))" -q
            test -f "${CL_REPOSITORY_CLIENT_DIR}/cl-repository-client.asd"
            echo "ok sbcl=${CL_CI_SBCL_VERSION} client=${CL_REPOSITORY_CLIENT_VERSION}"
          '

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${IMAGE}:local" "${IMAGE}:latest"
          docker tag "${IMAGE}:local" "${IMAGE}:sbcl-${SBCL_VERSION}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sbcl-${SBCL_VERSION}"
