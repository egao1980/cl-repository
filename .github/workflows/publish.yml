name: Publish to GHCR

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository }}
  SBCL_VERSION: 2.6.7

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Cached Roswell + SBCL + qlot; release assets only on a cold cache.
      - uses: ./.github/actions/setup-roswell
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}

      - name: Install dependencies
        run: |
          command -v qlot >/dev/null || ros install qlot
          qlot install

      - name: Build and publish (single image, per-system repos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAMESPACE=$(echo "${{ env.NAMESPACE }}" | tr '[:upper:]' '[:lower:]')

          cat > /tmp/publish.lisp <<LISP
          (asdf:load-system "cl-repository-packager")
          (let* ((auth (cl-oci-client/auth:make-auth-config
                         :username "${{ github.actor }}"
                         :password (uiop:getenv "GITHUB_TOKEN")))
                 (reg (cl-oci-client/registry:make-registry
                        "https://${REGISTRY}" :auth auth))
                 (spec (cl-repository-packager/asdf-plugin:auto-package-spec "cl-oci")))
            (setf (cl-repository-packager/build-matrix:package-spec-version spec)
                  "${VERSION}")
            (setf (cl-repository-packager/build-matrix:package-spec-provides spec)
                  (remove-if (lambda (s) (search "test" s))
                             (cl-repository-packager/build-matrix:package-spec-provides spec)))
            (let ((result (cl-repository-packager/build-matrix:build-package spec)))
              (cl-repository-packager/publisher:publish-package
                reg "${NAMESPACE}" "${VERSION}" result spec)))
          LISP

          qlot exec ros -l /tmp/publish.lisp

      # setup-oras downloads from GitHub releases on every call (no cache
      # lookup); 504s there failed whole matrices (2026-11-08). Keep the
      # verified binary per version and only call setup-oras on a miss.
      - name: Cache oras
        id: oras-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/cl-repo-ci/oras/1.2.3
          key: ${{ runner.os }}-${{ runner.arch }}-oras-bin-1.2.3

      - name: Install oras
        if: steps.oras-cache.outputs.cache-hit != 'true'
        uses: oras-project/setup-oras@v2
        with:
          version: 1.2.3

      - name: Put cached oras on PATH
        shell: bash
        env:
          ORAS_DIR_VERSION: 1.2.3
          ORAS_CACHE_HIT: ${{ steps.oras-cache.outputs.cache-hit }}
        run: |
          d="${HOME}/.cache/cl-repo-ci/oras/${ORAS_DIR_VERSION}"
          if [[ "${ORAS_CACHE_HIT}" != "true" ]]; then
            mkdir -p "${d}"
            cp "$(command -v oras)" "${d}/"
          fi
          command -v cygpath >/dev/null 2>&1 && d="$(cygpath -w "${d}")"
          echo "${d}" >> "$GITHUB_PATH"

      - name: Verify published artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAMESPACE=$(echo "${{ env.NAMESPACE }}" | tr '[:upper:]' '[:lower:]')
          ORAS_AUTH='{"auths":{"ghcr.io":{"username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}"}}}'

          for SYSTEM in cl-oci cl-oci-client cl-repository-packager cl-repository-client cl-repository-ql-exporter; do
            REF="${{ env.REGISTRY }}/${NAMESPACE}/${SYSTEM}:${VERSION}"
            echo "::group::Verifying ${REF}"
            oras manifest fetch "${REF}" --registry-config <(echo "${ORAS_AUTH}")
            echo "::endgroup::"
          done

          echo "::group::Verifying project catalog anchor"
          oras manifest fetch "${{ env.REGISTRY }}/${NAMESPACE}/catalog:latest" \
            --registry-config <(echo "${ORAS_AUTH}") || echo "No project catalog anchor (OK for first publish)"
          echo "::endgroup::"
