# Reusable workflow: publish a Lisp package + native-library overlays to GHCR
# (optional cffi-grovel-output when artifacts nest lib/ + grovel/).
#
# Caller builds natives and uploads artifacts named native-<os>-<arch>, then:
#
#   publish:
#     needs: build
#     uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@<ref>
#     with:
#       package-name: cl-stack-ssl
#       version: 3.4.1
#       # depends-on / cffi-libraries / provides optional — prefer .asd :cl-repo
#       source-paths: |
#         cl-stack-ssl.asd
#         src
#         LICENSE
#         README.md
#         NOTICE
#       packager-tag: "latest"
#     secrets: inherit
#     permissions:
#       packages: write
#       contents: read
#
# Lisp (packager / oci-client) loads via setup-lisp + cl-repo:ensure-systems —
# same as publish-source.yml. Native binaries stay in artifact overlays.
# Do not apt-install SBCL, bootstrap Quicklisp, or raw-oras the packager tarball.
#
name: Publish native OCI package

on:
  workflow_call:
    inputs:
      package-name:
        description: ASDF / OCI system name
        required: true
        type: string
      version:
        description: Package version tag
        required: true
        type: string
      registry:
        description: OCI registry host
        required: false
        type: string
        default: ghcr.io
      namespace:
        description: Registry namespace (default <owner>/cl-systems)
        required: false
        type: string
        default: ""
      description:
        description: Package description
        required: false
        type: string
        default: ""
      license:
        description: SPDX / short license id
        required: false
        type: string
        default: MIT
      depends-on:
        description: Optional override; empty → .asd :depends-on via auto-package-spec
        required: false
        type: string
        default: ""
      provides:
        description: Optional override; empty → .asd :cl-repo :provides
        required: false
        type: string
        default: ""
      cffi-libraries:
        description: Optional override; empty → .asd :cl-repo :cffi-libraries
        required: false
        type: string
        default: ""
      source-paths:
        description: Newline- or comma-separated paths to stage (Lisp-only)
        required: true
        type: string
      packager-tag:
        description: cl-repository-packager OCI tag (client ensure-systems)
        required: false
        type: string
        default: "latest"
      skip-catalog:
        description: Skip shared namespace catalog write
        required: false
        type: boolean
        default: true
      artifact-download-path:
        description: Where download-artifact places native-* dirs
        required: false
        type: string
        default: native-artifacts
      source-overlay-artifact:
        description: Optional artifact to unpack over workspace after checkout (e.g. synced-source)
        required: false
        type: string
        default: ""
      ci-ref:
        description: Override cl-repository ref for scripts/ci (empty → this workflow's SHA)
        required: false
        type: string
        default: ""
      client-version:
        description: cl-repository-client OCI tag
        required: false
        type: string
        default: "latest"
      sbcl-version:
        required: false
        type: string
        default: "2.6.7"
      roswell-version:
        required: false
        type: string
        default: "26.02.116"
      ci-image:
        description: Job container with ros/SBCL/client. Empty = install on the VM.
        required: false
        type: string
        default: "ghcr.io/egao1980/cl-repository/ci-base:latest"
      sbcl-dynamic-space-mb:
        description: SBCL dynamic-space-size for gzip of native overlays (MB)
        required: false
        type: number
        default: 8192
    secrets:
      # Optional override; prefer secrets: inherit (uses github.token)
      PUBLISH_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Image string or null. No `secrets` in this expression (reusable-workflow parse).
    container: ${{ inputs.ci-image != '' && inputs.ci-image || fromJSON('null') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    env:
      SBCL_VERSION: ${{ inputs.sbcl-version }}
      ROSWELL_VERSION: ${{ inputs.roswell-version }}
      GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Apply source overlay artifact
        if: inputs.source-overlay-artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.source-overlay-artifact }}
          path: ${{ github.workspace }}

      - name: Checkout cl-repository CI scripts
        uses: actions/checkout@v5
        with:
          # job.workflow_* is this reusable workflow, not the caller
          # (github.workflow_sha is the caller's commit — wrong repo).
          repository: ${{ inputs.ci-ref != '' && 'egao1980/cl-repository' || job.workflow_repository }}
          ref: ${{ inputs.ci-ref != '' && inputs.ci-ref || job.workflow_sha }}
          path: .cl-repository-ci
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: false

      - name: Download native artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ inputs.artifact-download-path }}

      - name: Arrange lib/<os>-<arch>
        run: |
          chmod +x .cl-repository-ci/scripts/ci/arrange-native-artifacts.sh
          .cl-repository-ci/scripts/ci/arrange-native-artifacts.sh \
            "$GITHUB_WORKSPACE" \
            "${{ inputs.artifact-download-path }}" \
            /tmp/platforms.txt

      - name: Stage Lisp-only source tree
        run: |
          chmod +x .cl-repository-ci/scripts/ci/stage-lisp-source.sh
          STAGING="${RUNNER_TEMP}/${{ inputs.package-name }}-src"
          .cl-repository-ci/scripts/ci/stage-lisp-source.sh \
            "$GITHUB_WORKSPACE" \
            "$STAGING" \
            "${{ inputs.source-paths }}"
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"
          echo "LIB_ROOT=${GITHUB_WORKSPACE}/lib" >> "$GITHUB_ENV"
          # Optional sibling from arrange-native-artifacts.sh (event backends).
          if [ -d "${GITHUB_WORKSPACE}/grovel" ]; then
            echo "GROVEL_ROOT=${GITHUB_WORKSPACE}/grovel" >> "$GITHUB_ENV"
          fi

      # uses: cannot interpolate inputs/github — GH parse-time restriction.
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: ${{ inputs.client-version }}
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: Install oras
        uses: oras-project/setup-oras@v2
        with:
          version: 1.2.3

      - name: Publish package + overlays
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
          PKG_NAME: ${{ inputs.package-name }}
          PKG_VERSION: ${{ inputs.version }}
          PKG_DESCRIPTION: ${{ inputs.description }}
          PKG_LICENSE: ${{ inputs.license }}
          PKG_DEPENDS_ON: ${{ inputs.depends-on }}
          PKG_PROVIDES: ${{ inputs.provides }}
          PKG_CFFI_LIBS: ${{ inputs.cffi-libraries }}
          SKIP_CATALOG: ${{ inputs.skip-catalog }}
          PACKAGER_VERSION: ${{ inputs.packager-tag }}
        run: |
          REGISTRY="${{ inputs.registry }}"
          NAMESPACE="${{ inputs.namespace }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="${{ github.repository_owner }}/cl-systems"
          fi
          NAMESPACE=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
          if [ "$REGISTRY" = "ghcr.io" ]; then
            REGISTRY_URL="https://${REGISTRY}"
          else
            REGISTRY_URL="http://${REGISTRY}"
          fi

          # Do not put comments inside VAR=val \ continuations — bash then
          # applies the env to a no-op and ros never sees PKG_SOURCE_DIR.
          export PKG_SOURCE_DIR="$STAGING"
          export LIB_ROOT="$LIB_ROOT"
          export PLATFORMS_FILE=/tmp/platforms.txt
          export OCI_REGISTRY="$REGISTRY"
          export REGISTRY_URL="$REGISTRY_URL"
          export OCI_NAMESPACE="$NAMESPACE"
          export GITHUB_ACTOR="${{ github.actor }}"
          ros dynamic-space-size=${{ inputs.sbcl-dynamic-space-mb }} \
            -l .cl-repository-ci/scripts/ci/publish-native-package.lisp -q

          PROVIDES="${{ inputs.provides }}"
          if [ -n "$PROVIDES" ]; then
            PRIMARY_OCI_NAME="${PROVIDES%% *}"
          else
            PRIMARY_OCI_NAME="${{ inputs.package-name }}"
          fi

          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"
          echo "PUBLISH_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "PRIMARY_OCI_NAME=$PRIMARY_OCI_NAME" >> "$GITHUB_ENV"

      - name: Verify published index
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN || github.token }}
        run: |
          oras manifest fetch \
            "${REGISTRY}/${NAMESPACE}/${PRIMARY_OCI_NAME}:${PUBLISH_VERSION}" \
            --registry-config <(echo "{\"auths\":{\"${REGISTRY}\":{\"username\":\"${{ github.actor }}\",\"password\":\"${GITHUB_TOKEN}\"}}}")
