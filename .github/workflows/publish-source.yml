# Reusable first-party source-only publish (auto-package-spec from the checkout .asd).
#
#   jobs:
#     publish:
#       uses: egao1980/cl-repository/.github/workflows/publish-source.yml@main
#       with:
#         version: ${{ inputs.version }}
#       permissions:
#         contents: read
#         packages: write
#
# Natives still use publish-native-package.yml. No per-repo publish-checkout.lisp.
name: Publish source package

on:
  workflow_call:
    inputs:
      system:
        description: ASDF system (empty → discover from *.asd)
        required: false
        type: string
        default: ""
      version:
        description: OCI tag (empty → .asd :version)
        required: false
        type: string
        default: ""
      packager-version:
        required: false
        type: string
        default: "latest"
      namespace:
        required: false
        type: string
        default: "egao1980/cl-systems"
      sbcl-version:
        required: false
        type: string
        default: "2.6.7"
      roswell-version:
        required: false
        type: string
        default: "26.02.116"
      client-version:
        required: false
        type: string
        default: "latest"
      ci-image:
        description: Job container with ros/SBCL/client. Empty = install on the VM.
        required: false
        type: string
        default: "ghcr.io/egao1980/cl-repository/ci-base:latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Image string or null. No `secrets` in this expression (reusable-workflow parse).
    container: ${{ inputs.ci-image != '' && inputs.ci-image || fromJSON('null') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    env:
      SBCL_VERSION: ${{ inputs.sbcl-version }}
      ROSWELL_VERSION: ${{ inputs.roswell-version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # uses: cannot interpolate inputs/github — GH parse-time restriction.
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: ${{ inputs.client-version }}
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: publish
          system: ${{ inputs.system }}
          version: ${{ inputs.version }}
          packager-version: ${{ inputs.packager-version }}
          oci-namespace: ${{ inputs.namespace }}
