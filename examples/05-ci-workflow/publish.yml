# Consumer publish-checkout.yml — canned reusable workflow. No publish-checkout.lisp.
name: Publish checkout to cl-systems

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag (default: .asd :version)"
        required: false
        default: ""
      packager_version:
        description: "cl-repository-packager OCI tag"
        required: false
        default: "latest"

jobs:
  publish:
    uses: egao1980/cl-repository/.github/workflows/publish-source.yml@main
    with:
      version: ${{ inputs.version }}
      packager-version: ${{ inputs.packager_version }}
    permissions:
      contents: read
      packages: write
